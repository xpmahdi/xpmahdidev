import httpx
import psycopg2
from psycopg2.extras import execute_batch

def ingest_records(api_url: str, db_connection):
    response = httpx.get(api_url, timeout=10.0)
    records = response.json().get("data", [])
    
    clean_data = [
        (item["id"], item["title"], item.get("score"), item.get("released_at"))
        for item in records if item.get("title")
    ]
    
    upsert_sql = """
        INSERT INTO media_catalog (external_id, title, score, released_at)
        VALUES (%s, %s, %s, %s)
        ON CONFLICT (external_id) DO UPDATE 
        SET score = EXCLUDED.score, updated_at = NOW();
    """
    with db_connection.cursor() as cur:
        execute_batch(cur, upsert_sql, clean_data, page_size=250)
    db_connection.commit()
    return len(clean_data)`;

    score NUMERIC(3, 1),
    released_at DATE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- B-Tree Performance Indexing
CREATE INDEX idx_media_score ON media_catalog (score DESC);
CREATE INDEX idx_media_released ON media_catalog (released_at);

-- Cache Invalidation Tracking
COMMENT ON TABLE media_catalog IS 'Synchronized via Redis in-memory cache key TTL.';`;
